services:
  redis:
    image: redis:latest
    container_name: redis
    ports:
      # Host port 6381, container port 6379. Host 6379 is often taken by another
      # local redis, so the integration tests use 127.0.0.1:6381.
      - "6381:6379"
    volumes:
      - redis_data:/data
    command: ["redis-server", "--requirepass", "user"]

  redis-ui:
    image: redis/redisinsight:latest
    container_name: redis-ui
    ports:
      - "5540:5540"
    environment:
      - RI_REDIS_HOST=redis
      - RI_REDIS_PORT=6379
      - RI_REDIS_USERNAME=default
      - RI_REDIS_PASSWORD=user
    volumes:
      - redis_ui:/data
    depends_on:
      - redis

  # Valkey speaks the Redis protocol. The container listens on 6379, and the
  # host port is 6380, next to redis on 6381.
  # Point the valkey backend at it with:
  #   VALKEY_ADDR=127.0.0.1:6380 VALKEY_PASSWORD=user
  # or the DSN valkey://:user@127.0.0.1:6380/0
  valkey:
    image: valkey/valkey:latest
    container_name: valkey
    ports:
      - "6380:6379"
    volumes:
      - valkey_data:/data
    command: ["valkey-server", "--requirepass", "user"]

  # Memcached has no authentication. 11211 is the default the memcached
  # backend uses (MEMCACHED_ADDRS=127.0.0.1:11211, or memcached://127.0.0.1:11211).
  memcached:
    image: memcached:latest
    container_name: memcached
    ports:
      - "11211:11211"

  # The inmemory backend runs inside the Go process, so it has no container.

volumes:
  redis_data:
  redis_ui:
  valkey_data: