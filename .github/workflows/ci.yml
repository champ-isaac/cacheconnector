name: CI

on:
  push:
    branches: [develop, main]
  pull_request:
    branches: [develop, main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  COVERAGE_THRESHOLD: "90"

jobs:
  quality:
    name: Code Quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Check formatting
        run: |
          unformatted=$(gofmt -l $(git ls-files '*.go' | grep -v '^vendor/'))
          if [ -n "$unformatted" ]; then
            echo "These files are not gofmt-formatted:"
            echo "$unformatted"
            exit 1
          fi
      - name: go mod tidy check
        run: |
          go mod tidy
          git diff --exit-code go.mod go.sum
      - name: go vet
        run: go vet ./...
      - name: golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.15.0
      # Compile and lint the files behind the integration build tag
      # (redis/tests, valkey/tests, memcached/tests). This starts no servers and
      # runs none of those tests; they need the docker compose stack.
      - name: go vet (integration tag)
        run: go vet -tags integration ./...
      - name: golangci-lint (integration tag)
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.15.0
          args: --build-tags integration

  security:
    name: Security
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: gosec
        run: |
          go install github.com/securego/gosec/v2/cmd/gosec@latest
          gosec -exclude-generated ./...
      - name: govulncheck
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          govulncheck ./...

  test:
    name: Unit Tests & Coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Run tests with race detector
        run: go test -race -covermode=atomic -coverpkg=./... -coverprofile=coverage.out ./...
      - name: Enforce coverage threshold
        run: |
          total=$(go tool cover -func=coverage.out | awk '/^total:/ {gsub("%","",$3); print $3}')
          echo "Total coverage: ${total}% (required: ${COVERAGE_THRESHOLD}%)"
          awk -v t="$total" -v min="$COVERAGE_THRESHOLD" 'BEGIN { exit (t+0 >= min+0) ? 0 : 1 }' \
            || { echo "::error::Coverage ${total}% is below ${COVERAGE_THRESHOLD}%"; exit 1; }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage
          path: coverage.out

  verify:
    name: Verify Backends
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      # Starts only the three servers the verify skill drives (not redis-ui).
      # Ports and container names come from docker-compose.yaml; verify.sh
      # waits until each backend answers a Set/Get round trip.
      - name: Start redis, valkey and memcached
        run: docker compose up -d redis valkey memcached
      - name: Verify all backends through the public API
        run: .claude/skills/verify-cacheconnector/scripts/verify.sh all
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: verify-evidence
          path: .claude/verify-evidence
